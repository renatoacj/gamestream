<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameStream – Assistir</title>
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="style.css">
<style>
  body { display: flex; flex-direction: column; height: 100vh; }
  .stage { flex: 1; min-height: 0; position: relative; background: #000; }
  canvas { width: 100%; height: 100%; object-fit: contain; display: block; }
  .overlay {
    position: absolute; inset: 0; display: grid; place-items: center;
    text-align: center; color: var(--muted); padding: 16px; pointer-events: none;
  }
  .overlay .big { font-size: 20px; color: var(--text); margin-bottom: 6px; }
  #unmute {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600;
    font-size: 16px; padding: 10px 20px; box-shadow: 0 4px 20px rgba(0,0,0,.5);
    animation: pulse-btn 1.6s ease-in-out infinite;
  }
  @keyframes pulse-btn { 50% { transform: translateX(-50%) scale(1.06); } }
  .bar {
    display: flex; align-items: center; gap: 10px; padding: 8px 16px;
    background: var(--panel); border-top: 1px solid var(--border); flex-wrap: wrap;
  }
  .bar .spacer { flex: 1; }
  .bar input[type=range] { width: 110px; accent-color: var(--accent); }
  /* Prévia dentro do app: só a imagem */
  body.preview .bar, body.preview #unmute { display: none; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="screen" width="1280" height="720"></canvas>
  <div class="overlay" id="overlay">
    <div><div class="big" id="overlayTitle">Conectando…</div><div id="overlayText"></div></div>
  </div>
  <button id="unmute" hidden>🔊 Clique para ativar o som</button>
</div>
<div class="bar">
  <span id="badge" class="badge"><span class="dot"></span><span id="badgeText">OFFLINE</span></span>
  <span class="muted" id="info"></span>
  <span class="spacer"></span>
  <button id="muteBtn" title="Ligar/desligar o som">🔇 Som desligado</button>
  <label title="Volume"><input type="range" id="volume" min="0" max="2" step="0.01" value="1"></label>
  <button id="fullscreen">⛶ Tela cheia</button>
</div>
<script src="viewer.js"></script>
</body>
</html>
